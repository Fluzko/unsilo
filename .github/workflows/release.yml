name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the arm runner rather than built on macos-13,
          # which GitHub is retiring and which now queues indefinitely. Apple's
          # clang targets both architectures, so the bundled C dependencies build
          # the same way.
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rusqlite is built from the bundled amalgamation, so the only thing a
      # static musl build needs is the musl C toolchain itself.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }} -p unsilo

      # A binary that cannot start is not a release artifact. The one
      # cross-compiled target cannot be run by its builder, so it is exempt.
      - name: Smoke test
        if: matrix.cross != true
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/unsilo"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version

      - name: Package
        shell: bash
        run: |
          NAME="unsilo-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            cp "target/${{ matrix.target }}/release/unsilo.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/unsilo" "dist/$NAME/"
          fi
          cp README.md CLI.md "dist/$NAME/"
          cd dist
          tar -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" 2>/dev/null \
            || sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v5
        with:
          name: unsilo-${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
