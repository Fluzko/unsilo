name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a run is right on a branch, where pushes come in bursts and only
  # the tip matters. On main every commit is meant to be verified, and cancelling
  # leaves one unverified: a re-run of an older commit can take the slot and kill
  # the run for a newer one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Pinned to a tag, not master. On master the action downloads whatever
      # version it currently points at, so a release still uploading its
      # binaries returns a 404 and fails a build that has nothing wrong with it.
      - uses: crate-ci/typos@v1.49.1
      # The install script is the first thing a stranger runs, so it is held to
      # the same bar as the code.
      - run: shellcheck install.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features --profile ci
      - run: cargo test --workspace --doc

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      # Uploading to codecov needs a CODECOV_TOKEN secret: tokenless uploads are
      # rejected, so the previous version of this job produced a report and threw
      # it away, kept green by fail_ci_if_error. The summary goes to the run where
      # it can be read, and the lcov is kept as an artifact.
      - name: Coverage
        run: |
          # --no-clean keeps the profile data so the summary reuses it instead
          # of running the whole suite a second time.
          cargo llvm-cov nextest --workspace --no-clean --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee summary.txt
          {
            echo '### Coverage'
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
