[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates in this workspace refer to each other by path and nothing else.
# Giving them a version would make cargo keep the dev-dependency in the
# published manifest, where it cannot resolve, so the wildcard is deliberate.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
